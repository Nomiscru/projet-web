<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Péférences</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>

    <div id="header"></div><!--load du template "header"-->

<body>
    <h2>Préférences du site
    </h2><!--tittre-->
    <fieldset id="preferences"><!--zone des formulaires-->
        <form id="themeForm"><!--zone 1° form thème-->
            <legend>Thème du site</legend>
            <select name="theme" id="theme">
                <option name="clairForm" id="clairForm" value="clairForm" selected>Clair</option>
                <option name="sombreForm" id="sombreForm" value="sombreForm">Sombre</option>
            </select>
        </form>
        <form id="affichageForm"><!--zone 2° form type affichege-->
            <legend>Format d'affichage de la liste des aprenants</legend>
            <div id="input">
            <label>    
                <input type="radio" name="affichageForm" id="listeForm" value="listeForm" checked>
                <label for="listeForm">Liste</label>
            </label>
            <label>
                <input type="radio" name="affichageForm" id="cartesForm" value="cartesForm">
                <label for="cartesForm">Cartes</label>
            </label>
            </div>
        </form>
    </fieldset>
    <div id="bouton"><!--boutons retour et save-->
        <button type="button" class="btnHome" onclick="window.location.href='index.html'">Retour à la page d'accueil</button>
        <button type="submit" id="btnSave" href="">Enregistrer</button>
    </div>
</body>

</html>
